name: Compiler le JAR

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: citizeneclipse-jar
          path: build/libs/*.jar
      - name: Publier le JAR (lien de téléchargement direct)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/citizeneclipse-*.jar citizeneclipse.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest citizeneclipse.jar \
            --title "Citizen Éclipse — dernière version" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}. NeoForge 21.1.215 / Minecraft 1.21.1."
